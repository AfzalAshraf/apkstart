appId: com.apkstart.win
productName: ApkStart
copyright: Copyright © 2026 ApkStart

directories:
  output: dist/release
  buildResources: build

# Package the PowerShell helper as a real file; the agent starts it by path.
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # Runtime image materialization uses the LZMA package and Windows x64 native binding.
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-win32-x64-msvc/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# ApkStart's maintained UI is English; keep the matching Chromium locale only.
electronLanguages:
  - en-US

# The full runtime payload is generated by build/prepare-runtime.js.
extraResources:
  - from: build/runtime
    to: runtime
    filter:
      - "**/*"
      - "!.prepared"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/ui/assets/appicon.ico
  requestedExecutionLevel: asInvoker

nsis:
  # Allow users to choose an installation location; no administrator rights required.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  # Recreate shortcuts on every install so they always point to the current executable.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: ApkStart-${version}-Setup.exe
  # Stop runtime processes that could hold files open during uninstall.
  include: build/installer.nsh

# The large system images are already compressed as XZ/gzip. NSIS compression is kept
# at normal to avoid spending substantial extra build time for negligible size savings.
compression: normal
