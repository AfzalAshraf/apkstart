name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish portable package
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (including Electron runtime)
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Test
        run: npm test

      - name: Package portable app
        run: npm run pack

      # Use 7-Zip instead of Compress-Archive: .NET Deflate produces a 105 MB archive from this directory,
      # while 7-Zip -mx=9 produces about 99.6 MB. That 5 MB determines whether Gitee can host one directly extractable
      # ZIP or two parts that users must concatenate manually. build/zip.js also enforces a size gate: above
      # 100 MiB, the job fails instead of silently reverting to split archives.
      - name: Compress release artifact (7-Zip, 100 MiB size gate)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node build/zip.js dist/ApkStart-win64-portable "ApkStart-$tag-win64-portable.zip" --limit-mb 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "ApkStart-$tag-win64-portable.zip" | Select-Object Name, Length

      # Create a Release and upload the lightweight portable app (the shell is small; the runtime downloads on first launch).
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkStart-$tag-win64-portable.zip"
          # Idempotent: if the release already exists (for example, a rerun or repeated tag push), skip creation and upload assets only.
          $existing = gh release view $tag --json tagName -q .tagName 2>$null
          # Use a curated .github/release-notes-<tag>.md when available; it is more useful than --generate-notes
          # and its generic “Full Changelog” output. Generate notes only when no curated file exists.
          $notes = ".github/release-notes-$tag.md"
          if (-not $existing) {
            if (Test-Path $notes) {
              gh release create $tag --title "ApkStart $tag" --notes-file $notes
            } else {
              gh release create $tag --title "ApkStart $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error "Upload failed: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[].name'

      # Mirror to Gitee: direct GitHub downloads can be very slow from some regions, while Gitee may be faster.
      # The compressed portable package is about 99.6 MB, within Gitee’s 100 MB per-file limit, so upload one complete ZIP.
      # Users can extract it directly; publish-gitee.js falls back to .part1/.part2 parts only if the limit is exceeded.
      # The 1.4 GB setup and runtime bundles exceed the limit by too much, so they remain on GitHub.
      # The app merges available assets from both sources, so updates are unaffected.
      # A missing token or network failure on Gitee should warn but not block the workflow; otherwise the build job fails,
      # and the dependent full job is skipped, preventing even the GitHub setup/runtime artifacts from being published.
      # A missing token still shows a failed step in the log; continue-on-error makes it visible but non-fatal.
      - name: Mirror portable release to Gitee
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        shell: pwsh
        run: |
          # Previously, a missing token silently skipped this step while reporting success.
          # That caused v0.3.4 to be missing from Gitee until it was noticed later.
          # Now a missing token fails this step instead of silently skipping publication.
          if (-not $env:GITEE_TOKEN) {
            Write-Error "GITEE_TOKEN is missing; this release will not be published to Gitee. Add GITEE_TOKEN under Settings → Secrets and variables → Actions with the required release permissions."
            exit 1
          }
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          # Use the same release notes as GitHub instead of a generic portable-package description on Gitee.
          $notes = ".github/release-notes-$tag.md"
          if (Test-Path $notes) {
            node tools/publish-gitee.js $tag --zip "ApkStart-$tag-win64-portable.zip" --notes $notes
          } else {
            node tools/publish-gitee.js $tag --zip "ApkStart-$tag-win64-portable.zip"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  full:
    name: Build full package (bundled runtime, works offline)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      # Assemble the runtime from official Google sources (emulator, platform-tools, AEHD, and the Play x86_64 image).
      # Write to engine/ using the same layout as local development.
      - name: Assemble runtime
        run: node build/fetch-runtime.js engine

      # prepare-runtime compresses system.img and vendor.img as XZ (LZMA2).
      # The CI runner has two cores; XZ_PRESET=6 reduces compression time from about two hours to 40 minutes, with a roughly 3% size increase.
      # XZ_TIMEOUT_MS is a watchdog: on timeout, terminate the compressor and fall back to gzip.
      # This prevents a missing stdin EOF from producing an empty file and hanging the job for hours.
      - name: Prepare runtime (reduced XZ preset for faster CI)
        run: node build/prepare-runtime.js --force
        env:
          XZ_PRESET: '6'
          XZ_TIMEOUT_MS: '3600000'

      # Bundle the Microsoft Visual C++ 2015–2022 x64 runtime required by the Android Emulator (Qt 6) and QEMU.
      # Without it, the app may fail to start on other PCs (0xc0000135 / missing MSVCP140).
      # Place it in build/runtime so electron-builder includes it in the installer; offline setup remains possible.
      - name: Download VC++ runtime for offline installation
        shell: pwsh
        run: |
          $dir = "build\runtime"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $out = "$dir\vc_redist.x64.exe"
          Write-Output "Downloading the VC++ 2015–2022 x64 runtime..."
          curl.exe -L -o $out "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1MB) { Write-Error "Failed to download vc_redist" }
          Get-Item $out | Select-Object Name, Length

      # electron-builder does not publish implicitly without a Git tag; with a tag, this job would still fail because it has no
      # GH_TOKEN and would exit with “GitHub Personal Access Token is not set” (the cause of previous full-build failures).
      # Pass --publish never explicitly; the next step uploads the installer to the Release with gh release upload.
      - name: Build full installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload full installer to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $setup = Get-ChildItem dist/release/*Setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "Setup.exe not found"; exit 1 }
          Write-Output ("Uploading {0} ({1:N0} MB)" -f $setup.Name, ($setup.Length / 1MB))
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $setup.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "Upload failed: $($setup.Name)"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'

      # The lightweight app no longer downloads the emulator and system images separately from dl.google.com.
      # Instead, it downloads this single bundle from the same GitHub Release source used by in-app updates,
      # keeping download reliability and troubleshooting in one place.
      # The images are already XZ-compressed, so bsdtar creates the ZIP without recompressing them and saves build time.
      - name: Package full runtime bundle (download source for lightweight app)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkStart-runtime-$tag.zip"
          if (-not (Test-Path "build\runtime\emulator\emulator.exe")) { Write-Error "build\runtime is incomplete"; exit 1 }
          tar.exe -a -cf $zip -C "build\runtime" .
          if ($LASTEXITCODE -ne 0) { Write-Error "Failed to archive runtime"; exit 1 }
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload full runtime bundle to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkStart-runtime-$tag.zip"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "Upload failed: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'
